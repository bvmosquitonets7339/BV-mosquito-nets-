<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BV Mosquito Nets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        /* Header / Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: #111;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
        }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
        }
        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
        }

        /* Hero Section with Dark Background */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1584467735811-0a4c2caa47d4?auto=format&fit=crop&w=1350&q=80') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            color: #fff;
        }
        .hero h3 {
            font-size: 16px;
            color: #20c997;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .hero h1 {
            font-size: 42px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .hero p {
            font-size: 18px;
            color: #ccc;
            max-width: 600px;
            margin-bottom: 30px;
        }

        /* Buttons */
        .btn-container {
            display: flex;
            gap: 15px;
        }
        .btn {
            padding: 15px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
        }
        .btn-primary {
            background-color: #20c997;
            color: #fff;
        }
        .btn-primary:hover {
            background-color: #17a589;
        }
        .btn-secondary {
            background-color: transparent;
            color: #fff;
            border: 2px solid #fff;
        }
        .btn-secondary:hover {
            background-color: #fff;
            color: #000;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">BV Mosquito Nets</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h3>Protect Your Family</h3>
        <h1>High-Quality Mosquito Nets</h1>
        <p>Keep your home safe, bug-free, and well-ventilated with our premium durable mosquito net solutions.</p>
        <div class="btn-container">
            <a href="#" class="btn btn-primary">Order Now</a>
            <a href="#" class="btn btn-secondary">Learn More</a>
        </div>
    </section>

</body>
</html>
